management.endpoint.health.show-details=always
management.metrics.tags.application=impulsa-a365

# DEPLOY ? Render usa la variable PORT; si no existe, usa 8081 (local)
server.port=${PORT:8081}

# Evita conflicto entre Springdoc y Actuator en deploy
